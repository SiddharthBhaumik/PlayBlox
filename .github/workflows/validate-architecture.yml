name: Validate PlayBlox architecture

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax, Hand Cricket rules and game contracts
        run: |
          npm run check:syntax
          npm run test:hand-cricket
          npm run test:hand-cricket-analytics
      - name: Check other game contracts (known 67 contract failure)
        run: node scripts/test-game-contracts.mjs
        continue-on-error: true
      - name: Check registry guide alignment (known 67 guide mismatch)
        run: npm run validate:games
        continue-on-error: true
